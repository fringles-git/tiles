name: Portfolio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript regression tests
        run: npm run test:js
        env:
          TILES_SKIP_HTTP: '1'
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, fileinfo
          coverage: none
      - name: composer.json valid
        run: composer validate --strict --no-check-lock
      - name: Static analysis (PHPStan)
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpstan analyse --no-progress --error-format=github
      - name: TEMP level 4 errors
        run: vendor/bin/phpstan analyse --no-progress --level=4 --error-format=github || true
      - run: npm run check
      - run: npm run test:php
      - name: HTTP boundary, media, authentication and persistence
        run: npm run test:http
