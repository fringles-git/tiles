name: Portfolio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.cjs
      - name: PHP syntax and gateway tests
        run: |
          find . -name '*.php' -not -path './config.local.php' -print0 | xargs -0 -n1 php -l
          php tests/widget-cache.test.php
          php tests/football.test.php
