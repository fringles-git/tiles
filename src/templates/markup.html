<div id="app">
  <header class="bar" id="bar">
    <div class="bar-in">
      <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span>Tiles<span id="savestate" class="savestate" role="status"></span></div>
      <div class="seg" role="group" aria-label="Mode">
        <button data-mode="edit" aria-pressed="true">Modifier</button>
        <button data-mode="preview" aria-pressed="false">Aperçu</button>
        <button data-mode="stats" aria-pressed="false">Stats</button>
      </div>
      <div class="acts">
        <button class="btn ib-btn" data-act="undo" aria-label="Annuler la dernière action (Ctrl+Z)" title="Annuler la dernière action (Ctrl+Z)" disabled><span aria-hidden="true">↶</span></button>
        <button class="btn ib-btn" data-act="redo" aria-label="Rétablir (Ctrl+Maj+Z)" title="Rétablir (Ctrl+Maj+Z)" disabled><span aria-hidden="true">↷</span></button>
        <button class="btn" data-act="add" aria-label="Ajouter un bloc"><span class="i-plus" aria-hidden="true"></span><span class="lbl">Ajouter un bloc</span></button>
        <span class="pub-group">
          <button class="btn pri" data-act="publish" title="Rendre les modifications visibles sur la page publique">Publier</button>
          <button class="btn pri pub-more" type="button" aria-label="Options de publication" title="Options de publication" aria-haspopup="menu" aria-expanded="false" popovertarget="pub-menu" hidden><span aria-hidden="true">▾</span></button>
          <a class="btn" data-live href="./" target="_blank" rel="noopener" hidden aria-label="Voir la page publique (nouvel onglet)" title="Voir la page publique (nouvel onglet)"><span class="i-eye" aria-hidden="true"></span><span class="lbl">Voir en ligne</span><span aria-hidden="true">↗</span></a>
        </span>
        <button class="btn ib-btn" type="button" aria-label="Plus d’options" title="Plus d’options" aria-haspopup="menu" aria-expanded="false" popovertarget="more-menu"><span aria-hidden="true">⋮</span></button>
      </div>
      <div id="pub-menu" class="tb-menu" popover>
        <div focusgroup="menu nomemory" aria-label="Options de publication">
          <button type="button" data-act="discard" class="danger">Revenir à la version publiée…</button>
        </div>
      </div>
      <div id="more-menu" class="tb-menu" popover>
        <div focusgroup="menu nomemory" aria-label="Plus d’options">
          <a href="./" target="_blank" rel="noopener" data-menu-link><span class="i-eye" aria-hidden="true"></span>Page publique <span class="muted">(nouvel onglet ↗)</span></a>
          <button type="button" data-act="design"><span class="i-pal" aria-hidden="true"></span>Apparence</button>
          <button type="button" data-act="journal"><span class="i-doc" aria-hidden="true"></span>Journal · articles</button>
          <button type="button" data-act="connections"><span aria-hidden="true">⚙</span>Connexions (données en direct)</button>
          <button type="button" data-act="export"><span class="i-code" aria-hidden="true"></span>Exporter / importer</button>
          <hr>
          <button type="button" data-act="account"><span aria-hidden="true">◐</span>Compte</button>
        </div>
      </div>
    </div>
  </header>
  <div class="banner" id="banner" hidden>
    <div class="banner-in"><span class="sp"><b>Sample page.</b> Click any block to edit it, drag blocks to reorder, and use the size buttons to reshape them. Changes save to your site automatically.</span>
      <button class="btn sm" data-act="empty">Start empty</button><button class="btn sm ghost" data-act="hide-banner">Dismiss</button></div>
  </div>
  <main class="page" id="page">
    <div class="page-in">
      <aside class="prof" id="prof"></aside>
      <div class="grid-wrap"><nav class="jumpbar" id="jumpbar" aria-label="Sur cette page" hidden></nav><div id="statsbox"></div><details class="explore-tools"><summary><span class="i-search" aria-hidden="true"></span> Rechercher dans le portfolio</summary><label for="explore-search" class="sr-only">Rechercher un projet, une compétence ou une entreprise</label><input id="explore-search" type="search" placeholder="Projet, compétence, entreprise…" autocomplete="off"><div class="explore-categories" role="group" aria-label="Catégorie"><button type="button" data-category="all" aria-pressed="true">Tout</button><button type="button" data-category="projects" aria-pressed="false">Projets</button><button type="button" data-category="photos" aria-pressed="false">Photos & vidéo</button></div><div id="project-kinds" class="project-kinds" role="group" aria-label="Type de projet" hidden><button type="button" data-project-kind="all" aria-pressed="true">Tous les projets</button><button type="button" data-project-kind="saas" aria-pressed="false">SaaS</button><button type="button" data-project-kind="app" aria-pressed="false">App</button><button type="button" data-project-kind="site" aria-pressed="false">Site</button><button type="button" data-project-kind="experiment" aria-pressed="false">Expérimentation</button></div><p id="explore-count" class="explore-count" role="status" aria-live="polite"></p></details><div class="grid" id="grid"></div></div>
    </div>
  </main>
  <div class="fab" id="fab" hidden><button data-mode="edit"><span class="i-edit"></span>Back to editor</button><button data-mode="stats"><span class="i-chart"></span>Stats</button></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="dh"><h3 id="dtitle">Edit</h3><button class="icon-btn" data-act="close" aria-label="Close panel"><span class="i-x"></span></button></div>
    <div class="db" id="dbody"></div>
  </aside>
  <div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tbtn" hidden>Undo</button></div>
</div>
