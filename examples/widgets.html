<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tiles · Cartes interactives</title>

<p class="demo-banner"><strong>Tiles · Cartes interactives</strong><br>Aucun son, appel API ou fond de carte avant votre clic. Les tailles S / W / T / L / bandeau révèlent des niveaux de détail différents.</p>
<div id="demo"></div>
<script>
window.TILES_BOOT={mode:'public',page:{v:1,sample:false,profile:{name:'Brandon Lazarre',role:'Musique, sport & exploration',bio:'Gospel et classique dans les oreilles. Un œil sur la F1. Et toujours basé à Troyes.',location:'Troyes, France',showNav:true,statusOn:false},theme:{skin:'light',accent:'#0B7A75',font:'figtree',radius:20,gap:14,layout:'top'},tiles:[]}};
let n=0;for(const type of ['radio','sport','atlas']){
window.TILES_BOOT.page.tiles.push({id:'section-'+type,type:'section',size:'full',data:{title:{radio:'Dans mes oreilles',sport:'Au bord de la piste',atlas:'Mon point de départ'}[type]}});
for(const size of ['s','w','t','l','bar'])window.TILES_BOOT.page.tiles.push({id:'demo-'+(++n),type,size,data:type==='radio'?{title:'La sélection · '+size.toUpperCase(),genre:'gospel'}:type==='sport'?{title:'Formule 1 · '+size.toUpperCase(),follow:'f1'}:{place:'Troyes · '+size.toUpperCase(),lat:'48.2973',lon:'4.0744',zoom:'12',note:'Aube, Grand Est · France'}});
}
for(const follow of ['psg','france'])window.TILES_BOOT.page.tiles.push({id:'support-'+follow,type:'sport',size:'w',data:{follow}});
window.TILES_BOOT.page.tiles.push({id:'languages-demo',type:'languages',size:'w',data:{title:'Langues',items:'Français | C2 | Bilingue, niveau déclaré\nEnglish | C2 | Bilingual, self-reported'}});
// Static shell fixture: do not make the private src/templates directory web-readable.
Promise.resolve("<div id=\"app\">\n  <header class=\"bar\" id=\"bar\">\n    <div class=\"bar-in\">\n      <div class=\"brand\"><span class=\"brand-mark\"><i></i><i></i><i></i></span>Tiles<span id=\"savestate\" class=\"savestate\" aria-live=\"polite\">Saved</span></div>\n      <div class=\"seg\" role=\"group\" aria-label=\"Mode\">\n        <button data-mode=\"edit\" aria-pressed=\"true\">Edit</button>\n        <button data-mode=\"preview\" aria-pressed=\"false\">Preview</button>\n        <button data-mode=\"stats\" aria-pressed=\"false\">Stats</button>\n      </div>\n      <div class=\"acts\">\n        <button class=\"btn\" data-act=\"connections\" aria-label=\"Connexions API\"><span aria-hidden=\"true\">\u2699</span><span class=\"lbl\">APIs</span></button>\n        <a class=\"btn ghost\" href=\"./\" target=\"_blank\" rel=\"noopener\" aria-label=\"Open public page\"><span class=\"i-eye\"></span><span class=\"lbl\">Live page</span></a>\n        <button class=\"btn\" data-act=\"design\" aria-label=\"Design\"><span class=\"i-pal\"></span><span class=\"lbl\">Design</span></button>\n        <button class=\"btn\" data-act=\"export\" aria-label=\"Export and import\"><span class=\"i-code\"></span><span class=\"lbl\">Export</span></button>\n        <button class=\"btn pri\" data-act=\"add\" aria-label=\"Add block\"><span class=\"i-plus\"></span><span class=\"lbl\">Add block</span></button>\n      </div>\n    </div>\n  </header>\n  <div class=\"banner\" id=\"banner\" hidden>\n    <div class=\"banner-in\"><span class=\"sp\"><b>Sample page.</b> Click any block to edit it, drag blocks to reorder, and use the size buttons to reshape them. Changes save to your site automatically.</span>\n      <button class=\"btn sm\" data-act=\"empty\">Start empty</button><button class=\"btn sm ghost\" data-act=\"hide-banner\">Dismiss</button></div>\n  </div>\n  <main class=\"page\" id=\"page\">\n    <div class=\"page-in\">\n      <aside class=\"prof\" id=\"prof\"></aside>\n      <div class=\"grid-wrap\"><nav class=\"jumpbar\" id=\"jumpbar\" aria-label=\"Sur cette page\" hidden></nav><div id=\"statsbox\"></div><details class=\"explore-tools\"><summary>\u2315 Rechercher dans le portfolio</summary><label for=\"explore-search\"><span aria-hidden=\"true\">\u2315</span>Explorer mon univers</label><input id=\"explore-search\" type=\"search\" placeholder=\"Projet, comp\u00e9tence, entreprise\u2026\" autocomplete=\"off\"><div class=\"explore-categories\" role=\"group\" aria-label=\"Cat\u00e9gorie\"><button type=\"button\" data-category=\"all\" aria-pressed=\"true\">Tout</button><button type=\"button\" data-category=\"projects\" aria-pressed=\"false\">Projets</button><button type=\"button\" data-category=\"photos\" aria-pressed=\"false\">Photos & vid\u00e9o</button><button type=\"button\" data-category=\"career\" aria-pressed=\"false\">Parcours</button><button type=\"button\" data-category=\"personal\" aria-pressed=\"false\">Personnel</button></div><p id=\"explore-count\" class=\"explore-count\" role=\"status\" aria-live=\"polite\"></p></details><div class=\"grid\" id=\"grid\"></div></div>\n    </div>\n  </main>\n  <div class=\"fab\" id=\"fab\" hidden><button data-mode=\"edit\"><span class=\"i-edit\"></span>Back to editor</button><button data-mode=\"stats\"><span class=\"i-chart\"></span>Stats</button></div>\n  <div class=\"scrim\" id=\"scrim\"></div>\n  <aside class=\"drawer\" id=\"drawer\" aria-hidden=\"true\">\n    <div class=\"dh\"><h3 id=\"dtitle\">Edit</h3><button class=\"icon-btn\" data-act=\"close\" aria-label=\"Close panel\"><span class=\"i-x\"></span></button></div>\n    <div class=\"db\" id=\"dbody\"></div>\n  </aside>\n  <div class=\"toast\" id=\"toast\" role=\"status\"><span id=\"tmsg\"></span><button id=\"tbtn\" hidden>Undo</button></div>\n</div>\n\n\n").then(html=>{
document.getElementById('demo').innerHTML=html;
const widgets=document.createElement('script');widgets.src='../public/assets/js/widgets.js';widgets.onload=()=>{const experience=document.createElement('script');experience.src='../public/assets/js/experience.js';experience.onload=()=>{const app=document.createElement('script');app.src='../public/assets/js/app.js';document.body.appendChild(app)};document.body.appendChild(experience)};document.body.appendChild(widgets);
}).catch(()=>{document.getElementById('demo').textContent='Ouvrez cet exemple depuis un serveur HTTP.'});
</script></body></html>
